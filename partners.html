<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The Partners page moved to /partners/ so it serves without the .html suffix.
     GitHub Pages has no server-side rewrites, so this stub keeps old links,
     bookmarks and anything already shared (the X article) from 404ing. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://solaralotto.io/partners/">
<meta http-equiv="refresh" content="0; url=/partners/">
<title>Partners — SOLARA</title>
<script>
  // Carry the query string and #section anchor across (partners.html#enquire ->
  // /partners/#enquire) and use replace() so Back does not bounce the visitor
  // straight back here. The meta refresh above is the no-JS fallback; it cannot
  // carry the anchor, so it only lands on the top of the page.
  location.replace('/partners/' + location.search + location.hash);
</script>
</head>
<body>
<p>The Partners page has moved to <a href="/partners/">/partners/</a>.</p>
</body>
</html>
