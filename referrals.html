<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The leaderboard moved to /referrals/ so it serves without the .html suffix.
     GitHub Pages has no server-side rewrites, so this stub keeps old links,
     bookmarks and anything already shared from 404ing. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://solaralotto.io/referrals/">
<meta http-equiv="refresh" content="0; url=/referrals/">
<title>Referral Leaderboard — SOLARA</title>
<script>
  // Carry the query string across (?demo=1 is the layout preview) and use
  // replace() so Back does not bounce the visitor straight back here.
  location.replace('/referrals/' + location.search + location.hash);
</script>
</head>
<body>
<p>The referral leaderboard has moved to <a href="/referrals/">/referrals/</a>.</p>
</body>
</html>
